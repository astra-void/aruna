name: publish

# Publishes the full Aruna package graph (8 native targets + @arunajs/core +
# @arunajs/compiler + @arunajs/aruna + create-aruna-app) to npm, on two channels:
#
#   - stable: a pushed v* tag publishes the version in package.json under the
#     `latest` dist-tag. The tag must name that version and point at a commit
#     on main; this is the only way to publish stable.
#   - canary: a manual run (workflow_dispatch) publishes
#     `<next patch>-canary.<sha7>.<run>` under the `canary` dist-tag
#     (scripts/canary-version.ts sets it in every job). No guarantees beyond
#     "built from the commit it was run on" — see docs/stability.md.
#   - rehearsal: a manual run with `dry_run` checked runs every job below on the
#     canary version, but the last step is `npm publish --dry-run`: nothing
#     reaches npm, and no trusted publisher is needed. Use it to prove the
#     whole graph builds, loads and packs before the first real publish.
#
# Nothing is built for release until the commit passes the whole of ci.yaml
# (`verify`, called as a reusable workflow) and, for a tag, the release-ref
# checks. A red commit cannot reach npm on either channel.
#
# The 8 native targets are built in parallel, one job per target, each on the
# cheapest runner that can build it:
#   - darwin-* → macos-14 (Apple SDK; arm64 is native, x64 cross-builds via Zig)
#   - linux-*  → ubuntu-latest via cargo-zigbuild (gnu + musl)
#   - win32-*  → ubuntu-latest via cargo-xwin (MSVC ABI)
# Each build job stages `.npm/compiler-<target>` and uploads it as an artifact.
#
# Most of those are cross builds, so before anything is published each binary is
# loaded on hardware of its own OS, CPU and libc (`load-native`): an Intel Mac,
# arm64 Linux and Windows runners, and Alpine containers for musl. A binary that
# does not load blocks the release instead of shipping as a supported target.
#
# The publish job downloads every native artifact, builds the TypeScript
# packages, stages the compiler/core/aruna/create-aruna-app manifests around the pre-built
# natives (--assemble), and publishes the whole graph in dependency order.
#
# Auth uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. Configure a
# trusted publisher for each package on npmjs.com pointing at this repo and
# workflow file. Provenance attestations are attached automatically.

on:
  push:
    tags:
      - "v*"
  # Canary only: stable goes through a v* tag, so a manual run can never publish
  # `latest` from an arbitrary branch.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: run every job, but publish with --dry-run (nothing reaches npm)"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Only the publish job gets id-token: write; everything before it (including
# the called ci.yaml) runs with read-only contents.
permissions:
  contents: read

env:
  # canary for a manual run; stable for a v* tag.
  CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'canary' || 'stable' }}

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci.yaml

  release-ref:
    name: release ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag is the release: it must name the lockstep version every package
      # manifest carries, or npm would get a version nobody tagged.
      - name: Tag matches the package versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          status=0
          for manifest in packages/compiler/package.json packages/core/package.json packages/aruna/package.json packages/create-aruna-app/package.json; do
            version="$(node -p "require('./${manifest}').version")"
            if [ "$version" != "$tag_version" ]; then
              echo "::error file=${manifest}::version ${version} does not match tag ${GITHUB_REF_NAME}"
              status=1
            fi
          done
          exit "$status"

      - name: Tag points at a commit on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; stable releases are cut from main only"
            exit 1
          fi

  build-native:
    name: build ${{ matrix.target }}
    needs: [verify, release-ref]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't publish a partial graph: if any native target fails to build, the
      # publish job (which `needs` this one) is skipped entirely.
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-14
            zigbuild: true
          - target: linux-x64-gnu
            runner: ubuntu-latest
            zigbuild: true
          - target: linux-arm64-gnu
            runner: ubuntu-latest
            zigbuild: true
          - target: linux-x64-musl
            runner: ubuntu-latest
            zigbuild: true
          - target: linux-arm64-musl
            runner: ubuntu-latest
            zigbuild: true
          - target: win32-x64-msvc
            runner: ubuntu-latest
            xwin: true
          - target: win32-arm64-msvc
            runner: ubuntu-latest
            xwin: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # One cache per target: cross builds nest output under
          # target/<triple>/, so each target has an independent incremental
          # cache and they never evict one another.
          key: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v2
        with:
          # Pin an explicit released version; "latest" can resolve to a build
          # that community mirrors haven't propagated yet (404s).
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install cargo-xwin
        if: matrix.xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the build: the staged native package carries the version.
      - name: Set the canary version
        if: env.CHANNEL == 'canary'
        run: pnpm exec tsx scripts/canary-version.ts

      - name: Build native target
        run: pnpm release:build-native --mode cross --targets ${{ matrix.target }}

      - name: Upload staged native package
        uses: actions/upload-artifact@v4
        with:
          # Artifact name matches the staged directory name so the publish job
          # can download it straight back into `.npm/compiler-<target>`.
          name: compiler-${{ matrix.target }}
          path: .npm/compiler-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  load-native:
    name: load ${{ matrix.target }}
    needs: build-native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64-gnu
            runner: ubuntu-latest
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-musl
            runner: ubuntu-latest
            alpine: true
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            alpine: true
          - target: win32-x64-msvc
            runner: windows-latest
          - target: win32-arm64-msvc
            runner: windows-11-arm
    env:
      # Loads the addon and calls into it, so a binary that links but cannot run
      # (wrong libc, missing runtime, wrong CPU) fails here.
      SMOKE: >-
        const m = require(require("node:path").resolve(process.argv[1]));
        const d = m.primitiveDescriptors();
        if (d == null) throw new Error("primitiveDescriptors returned nothing");
        console.log("loaded on", process.platform, process.arch, "-", Object.keys(m).length, "exports");
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.target }}
          path: native

      - uses: actions/setup-node@v4
        if: ${{ !matrix.alpine }}
        with:
          node-version: 22

      - name: Load the addon
        if: ${{ !matrix.alpine }}
        shell: bash
        run: node -e "$SMOKE" "native/compiler.${{ matrix.target }}.node"

      # JavaScript actions cannot run inside an Alpine container on arm64, so
      # musl is checked with a plain docker run on the host instead.
      - name: Load the addon (Alpine)
        if: ${{ matrix.alpine }}
        shell: bash
        run: |
          docker run --rm -e SMOKE -v "$PWD/native:/native:ro" node:22-alpine \
            sh -c 'node -e "$SMOKE" "/native/compiler.${{ matrix.target }}.node"'

  publish:
    needs: [build-native, load-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance + OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Publishing goes through `npm publish` (scripts/release.ts): under OIDC
      # trusted publishing npm attaches the provenance attestation, which pnpm
      # did not. Trusted publishing needs npm 11.5.1 or later; Node 22 ships an
      # older npm, so install a current 11.x first. release.ts checks the version.
      - name: Install npm with trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          # Each `compiler-<target>` artifact is extracted into its own
          # `.npm/compiler-<target>/` directory — exactly what --assemble expects.
          pattern: compiler-*
          path: .npm

      - name: Set the canary version
        if: env.CHANNEL == 'canary'
        run: pnpm exec tsx scripts/canary-version.ts

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm release:publish --assemble --provenance --no-verify-credentials --tag ${{ env.CHANNEL == 'canary' && 'canary' || 'latest' }}

      # `npm publish --dry-run` prints each tarball's files and size, so the
      # job log is the record of what the graph would ship.
      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm release:dry-run --assemble --no-verify-credentials --tag canary
