[package]
name = "aruna_compiler"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxc_allocator = "0.131.0"
oxc_ast = "0.131.0"
oxc_parser = "0.131.0"
oxc_span = "0.131.0"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
