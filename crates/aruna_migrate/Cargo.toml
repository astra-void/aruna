[package]
name = "aruna_migrate"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
oxc_allocator = "0.131.0"
oxc_ast = "0.131.0"
oxc_ast_visit = "0.131.0"
oxc_parser = "0.131.0"
oxc_span = "0.131.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
